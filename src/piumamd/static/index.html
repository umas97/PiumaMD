<!DOCTYPE html>
<html lang="en" data-theme="github">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiumaMD</title>
<link rel="icon" href="icons/piumamd.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/preview.css">
</head>
<body>

<!-- Sprite SVG unico: inline, cosi' non costa una richiesta in piu' e non
     dipende dal supporto di <use> su file esterni. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-piuma" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 3.5c-7.5.4-12.2 3.3-14 8.6-.7 2-.6 4 .2 5.7L18.2 5.8"/>
    <path d="M6.2 17.8c3.9.9 7.3-.1 9.7-2.9 1.7-2 2.9-4.9 3.6-8.8"/>
    <path d="M4 21c1.2-1.9 2.6-3.6 4.2-5.2"/>
    <path d="M9.6 14.4c1.9-.3 3.6-1 5-2.2"/>
  </symbol>
  <symbol id="i-dir" viewBox="0 0 16 16" fill="currentColor">
    <path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.2l1.4 1.6H13A1.5 1.5 0 0 1 14.5 5v7A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12z"/>
  </symbol>
  <symbol id="i-file" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
    <path d="M9 1.7H4.4A1.4 1.4 0 0 0 3 3.1v9.8a1.4 1.4 0 0 0 1.4 1.4h7.2a1.4 1.4 0 0 0 1.4-1.4V5.7z"/>
    <path d="M9 1.7v4h4"/>
  </symbol>
</svg>

<div id="app">

  <div id="menubar">
    <span class="brand"><svg width="18" height="18"><use href="#i-piuma"/></svg></span>

    <div class="menu-root">
      <button class="menu-btn" data-menu="file" data-i18n="menu.file" aria-expanded="false">File</button>
      <div class="menu-drop" data-for="file" hidden>
        <button class="menu-item" data-cmd="new"><span data-i18n="cmd.new">New document</span><span class="key">Ctrl+N</span></button>
        <button class="menu-item" data-cmd="openFolder"><span data-i18n="cmd.openFolder">Open folder…</span><span class="key"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="save"><span data-i18n="cmd.save">Save</span><span class="key">Ctrl+S</span></button>
        <button class="menu-item" data-cmd="export"><span data-i18n="cmd.export">Export…</span><span class="key"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="edit"><span data-i18n="cmd.edit">Edit</span><span class="key">Ctrl+E</span></button>
        <button class="menu-item" data-cmd="closeTab"><span data-i18n="cmd.closeTab">Close tab</span><span class="key">Ctrl+W</span></button>
      </div>
    </div>

    <div class="menu-root">
      <button class="menu-btn" data-menu="edit" data-i18n="menu.edit" aria-expanded="false">Edit</button>
      <div class="menu-drop" data-for="edit" hidden>
        <button class="menu-item" data-cmd="bold"><span data-i18n="cmd.bold">Bold</span><span class="key">Ctrl+B</span></button>
        <button class="menu-item" data-cmd="italic"><span data-i18n="cmd.italic">Italic</span><span class="key">Ctrl+I</span></button>
        <button class="menu-item" data-cmd="strike"><span data-i18n="cmd.strike">Strikethrough</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="link"><span data-i18n="cmd.link">Insert link</span><span class="key">Ctrl+K</span></button>
        <button class="menu-item" data-cmd="comment"><span data-i18n="cmd.comment">Toggle comment</span><span class="key">Ctrl+/</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="find"><span data-i18n="cmd.find">Find in document</span><span class="key">Ctrl+F</span></button>
        <button class="menu-item" data-cmd="searchAll"><span data-i18n="cmd.searchAll">Search in project</span><span class="key">Ctrl+Shift+F</span></button>
      </div>
    </div>

    <div class="menu-root">
      <button class="menu-btn" data-menu="view" data-i18n="menu.view" aria-expanded="false">View</button>
      <div class="menu-drop" data-for="view" hidden>
        <button class="menu-item" data-cmd="view:editor"><span data-i18n="cmd.viewEditor">Editor only</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="view:preview"><span data-i18n="cmd.viewPreview">Preview only</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="view:split"><span data-i18n="cmd.viewSplit">Split</span><span class="key"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="theme:light"><span data-i18n="theme.light">Light</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="theme:dark"><span data-i18n="theme.dark">Dark</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="theme:github"><span>GitHub</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="theme:dracula"><span>Dracula</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="theme:nord"><span>Nord</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="theme:midnight"><span>Midnight</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="theme:solarized"><span>Solarized</span><span class="key"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="toggleSidebar"><span data-i18n="cmd.toggleSidebar">Show sidebar</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="toggleSync"><span data-i18n="cmd.toggleSync">Synchronised scrolling</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="toggleReading"><span data-i18n="cmd.toggleReading">Open files for reading</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="refresh"><span data-i18n="cmd.refresh">Refresh preview</span><span class="key">Ctrl+R</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="lang:it"><span data-i18n="lang.it">Italiano</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="lang:en"><span data-i18n="lang.en">English</span><span class="key"></span></button>
      </div>
    </div>

    <div class="menu-root">
      <button class="menu-btn" data-menu="insert" data-i18n="menu.insert" aria-expanded="false">Insert</button>
      <div class="menu-drop" data-for="insert" hidden>
        <button class="menu-item" data-cmd="insertTable"><span data-i18n="cmd.insertTable">Table</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="insertToc"><span data-i18n="cmd.insertToc">Table of contents</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="insertCode"><span data-i18n="cmd.insertCode">Code block</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="insertRule"><span data-i18n="cmd.insertRule">Horizontal rule</span><span class="key"></span></button>
        <button class="menu-item" data-cmd="insertWiki"><span data-i18n="cmd.insertWiki">Wikilink</span><span class="key">[[</span></button>
      </div>
    </div>

    <div class="menu-root">
      <button class="menu-btn" data-menu="help" data-i18n="menu.help" aria-expanded="false">Help</button>
      <div class="menu-drop" data-for="help" hidden>
        <button class="menu-item" data-cmd="help"><span data-i18n="cmd.help">Guide</span><span class="key">F1</span></button>
        <button class="menu-item" data-cmd="about"><span data-i18n="cmd.about">About PiumaMD</span><span class="key"></span></button>
      </div>
    </div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div class="sb-head">
        <input id="tree-filter" type="text" data-i18n-ph="tree.filter" placeholder="Filter files…" spellcheck="false">
      </div>
      <div id="tree"></div>
    </aside>
    <div class="resizer" id="sb-resizer"></div>

    <section id="content">
      <div id="tabbar">
        <div id="tabs"></div>
        <button id="btn-edit" class="btn edit-btn" data-cmd="edit" hidden>
          <span aria-hidden="true">&#9998;</span> <span data-i18n="cmd.edit">Edit</span>
        </button>
      </div>

      <div id="welcome">
        <h1><svg width="30" height="30"><use href="#i-piuma"/></svg> PiumaMD</h1>
        <p data-i18n="welcome.sub" class="sub">A light Markdown editor.</p>
        <div class="row">
          <button class="btn primary" data-cmd="openFolder" data-i18n="welcome.open">Open folder</button>
          <button class="btn" data-cmd="new" data-i18n="welcome.new">New document</button>
          <button class="btn" data-cmd="help" data-i18n="welcome.help">Guide</button>
        </div>
        <h2 data-i18n="welcome.recent" style="font-size:15px;margin:14px 0 0">Recent</h2>
        <div class="recent" id="recent"></div>
      </div>

      <div id="panes" hidden>
        <div class="editor-wrap" id="editor-wrap">
          <div id="findbar" hidden>
            <input id="find-input" type="text" data-i18n-ph="find.ph" placeholder="Find…" spellcheck="false">
            <span class="count" id="find-count"></span>
            <button class="icon-btn" data-cmd="findNext" title="Enter">&#8595;</button>
            <button class="icon-btn" data-cmd="findPrev" title="Shift+Enter">&#8593;</button>
            <button class="icon-btn" data-cmd="findClose">&#10005;</button>
          </div>
          <pre class="editor-hl" aria-hidden="true"><code id="hl"></code></pre>
          <textarea class="editor-input" id="ed" spellcheck="false" wrap="soft"></textarea>
        </div>
        <div class="resizer" id="pane-resizer"></div>
        <div id="preview"></div>
      </div>
    </section>
  </div>

  <div id="statusbar">
    <span id="st-pos">—</span>
    <span id="st-count">—</span>
    <span class="spacer"></span>
    <span id="st-mode"></span>
    <button id="st-autosave" data-cmd="toggleAutosave"></button>
    <span id="st-saved"></span>
  </div>
</div>

<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
